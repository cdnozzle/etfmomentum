name: Daily ETF AUM snapshot

# Builds the AUM history the ETF Flows page estimates flows from.
# Requires a repository secret named EODHD_API_KEY.
on:
  schedule:
    - cron: "30 23 * * 1-5"  # after US close, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - run: python scripts/snapshot_aum.py --min-aum 100000000
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aum_snapshots.csv
          git diff --cached --quiet || git commit -m "AUM snapshot $(date -u +%F)"
          git push
